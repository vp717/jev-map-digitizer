[project]
name = "mapdig"
version = "0.1.0"
description = "Legend-driven point-symbol detection on maps (Jev vs trained detectors)"
requires-python = ">=3.12"
# Rendering stages also need Mapnik and GDAL Python bindings, which come from the render
# image's system packages (python3-mapnik, python3-gdal), not from PyPI.
dependencies = ["numpy", "scipy", "pillow", "pyyaml"]

[project.scripts]
mapdig = "mapdig.cli:main"

[dependency-groups]
# Runs on the host and drives the containers.
workflow = ["snakemake==9.27.2"]
# Installed in the `ml` image (GPU detection, training, hosted-model clients).
# Raster/vector I/O via rasterio/pyogrio wheels (bundled GDAL), not system GDAL.
ml = [
    "torch",
    "torchvision",
    "ultralytics",
    "opencv-python-headless",
    "rasterio",
    "pyogrio",
    "shapely",
    "anthropic",
    "typesafe-sdk[pil]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapdig"]

[tool.uv]
default-groups = ["workflow"]

# Driver 560.x supports CUDA <= 12.6, so take torch from PyTorch's cu126 index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
